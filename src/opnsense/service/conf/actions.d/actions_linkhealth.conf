[status]
command:/usr/local/opnsense/scripts/linkhealth/linkhealth.py status
parameters:
type:script_output
message:Reading link health status

# errors:no because configd throws a script's output away when it exits non-zero and answers
# "Execute error" instead (measured on this machine: "configctl linkhealth detail zz9"). This
# command says in its answer what went wrong and then exits 1 for the command line, so without
# this the GUI would be told nothing at all.
[detail]
command:/usr/local/opnsense/scripts/linkhealth/linkhealth.py detail
parameters:%s
type:script_output
errors:no
message:Reading link health detail for %s

[collect]
command:/usr/local/opnsense/scripts/linkhealth/linkhealth.py collect
parameters:
type:script_output
message:Collecting link health counters

# the second parameter is the neighbour to flood. It is left empty when the caller named none,
# and the script then picks one it has seen behind the port itself.
[test]
command:/usr/local/opnsense/scripts/linkhealth/linkhealth.py test
parameters:%s %s
type:script_output
message:Starting link health cable test on %s

# the test runs longer than a browser request, so this is how the page asks how it ended
[testresult]
command:/usr/local/opnsense/scripts/linkhealth/linkhealth.py testresult
parameters:%s
type:script_output
message:Reading link health cable test result for %s

# errors:no for the same reason as [detail]: "no recipient is configured" and whatever the mail
# server said are the whole point of pressing this, and both arrive with a non-zero exit.
[testmail]
command:/usr/local/opnsense/scripts/linkhealth/linkhealth.py testmail
parameters:
type:script_output
errors:no
message:Sending link health test message

# Blinking a socket's own LED is how a person ties a printed label to an interface
# name: it touches no traffic, the link never drops, and it works on a port with no
# cable in it. The worker detaches, so this returns as soon as the blinking starts.
[identify]
command:/usr/local/opnsense/scripts/linkhealth/linkhealth.py identify
parameters:%s %s
type:script_output
message:Identifying port %s

[stopidentify]
command:/usr/local/opnsense/scripts/linkhealth/linkhealth.py stopidentify
parameters:
type:script_output
message:Stopping port identification

[faceplate]
command:/usr/local/opnsense/scripts/linkhealth/linkhealth.py faceplate
parameters:
type:script_output
message:Reading the front panel layout

# Some sockets have no identification LED the driver can drive - the 10G cages on the
# reference appliance take the write and light nothing. Every socket has an activity
# light, so this beats that one instead: a second of packets, a second of silence. It
# needs a link and somebody answering at the other end, and it holds the same lock as
# the blink, because two sockets identifying themselves at once helps nobody.
[flicker]
command:/usr/local/opnsense/scripts/linkhealth/linkhealth.py flicker
parameters:%s %s %s
type:script_output
errors:no
message:Beating the activity light on %s
