# Optional: let Monit watch the ports as well.
#
# The plugin already mails you itself, through the same SMTP server Monit uses, with a per-port
# cooldown and a message that names the port, the device behind it and the reason. This file is for
# people who would rather have every alert on this firewall arrive from one place - their existing
# Monit setup - even if that means a plainer message.
#
# TURN ON ONE OR THE OTHER, NOT BOTH. With the plugin's own address set AND this check installed,
# every fault is reported twice, from two senders, with different wording.
#
# What the check does: `linkhealth.py check` exits 0 when no port is in a failing state and non-zero
# with one short line when one is. It reads the document the collector already wrote, so it costs
# nothing and never takes a reading of its own.
#
# TO INSTALL, in the GUI: Services > Monit > Service Settings > Add, and enter
#
#     Name         : linkhealth
#     Type         : Custom
#     Path         : /usr/local/opnsense/scripts/linkhealth/linkhealth.py check
#     Tests        : (add one, below)
#
# and a test under Service Tests:
#
#     Name         : port_failing
#     Condition    : status != 0
#     Action       : alert
#
# Do not paste this file into /usr/local/etc/monitrc. That file opens with "DO NOT EDIT THIS FILE"
# and OPNsense regenerates it from the configuration the next time anything touches Monit, which
# would throw the change away without a word. The GUI route above survives.
#
# The equivalent, for reference, in plain Monit syntax:

check program linkhealth with path "/usr/local/opnsense/scripts/linkhealth/linkhealth.py check"
    if status != 0 then alert
    every "*/5 * * * *"

# every 5 minutes rather than on every cycle: a cable that has just started corrupting frames will
# still be corrupting them five minutes from now, and the plugin's own mail is the fast path.
